# Qdrant vector database configuration
# Reference: https://qdrant.tech/documentation/guides/configuration/

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  # API key set via QDRANT__SERVICE__API_KEY env var

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  on_disk_payload: true          # keep payloads on disk to save RAM
  performance:
    max_search_threads: 0        # 0 = auto (number of CPU cores)

optimizers:
  default_segment_number: 2
  max_segment_size: 20000
  memmap_threshold: 20000
  indexing_threshold: 20000
  flush_interval_sec: 5

hnsw_index:
  m: 16
  ef_construct: 100
  full_scan_threshold: 10000

wal:
  wal_capacity_mb: 32

collections:
  # Shared collection for all document vectors
  # Created programmatically at startup; this is for reference only.
  # documents:
  #   vectors:
  #     dense:
  #       size: 1024
  #       distance: Cosine
  #     sparse:
  #       index:
  #         on_disk: false
